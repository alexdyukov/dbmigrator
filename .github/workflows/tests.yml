name: tests

on:
  push:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true

      - name: Checkout git repository
        uses: actions/checkout@v6

      - name: Run tests
        run: cd tests && go test -v ./...