version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  new: false
  fix: false
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
linters:
  default: all
  disable:
    - funlen
  settings:
    gomoddirectives:
      replace-local: true
